name: Release

on:
  push:
    # v3.x has its own tag-triggered release.yml; this file never runs there.
    branches: [master, next, 'v*.x', '!v3.x']

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: '24'
          cache: true
      - run: vp install --frozen-lockfile
      # The npm dist-tag for this branch: none in pre mode, latest on master, v<N>-latest on
      # v<N>.x. Fails for any other branch, so nothing can publish to latest by mistake.
      - id: tag
        run: |
          args=$(node scripts/release-tag.ts)
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - uses: changesets/action@v2.1.2
        with:
          # Formats the generated changelog, which otherwise fails vp check on the version PR.
          version-script: pnpm run version-packages
          publish-script: pnpm run release ${{ steps.tag.outputs.args }}
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          NPM_CONFIG_PROVENANCE: 'true'
