name: Feature request
description: Suggest a new Daraja API, option or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that mpesa-api doesn't support today?
    validations:
      required: true
  - type: input
    id: docs
    attributes:
      label: Daraja API or docs link
      placeholder: https://developer.safaricom.co.ke/apis/...
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How would you like to call it?
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
